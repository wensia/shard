name: Shard
options:
  bundleIdPrefix: dev.shard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    DEVELOPMENT_TEAM: LB69LR6TBL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ShardKit:
    path: ShardKit
targets:
  Shard:
    type: application
    platform: iOS
    sources:
      - path: Shard
        excludes:
          - "Resources/Renderer"
          - "Resources/Renderer/**"
      # Folder reference keeps the Vite output tree (index.html + assets/) intact.
      - path: Shard/Resources/Renderer
        type: folder
        buildPhase: resources
    dependencies:
      - package: ShardKit
    preBuildScripts:
      - name: Build Markdown renderer
        script: '"$SRCROOT/scripts/build-renderer.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Shard/Info.plist
      properties:
        CFBundleDisplayName: Shard
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Lets debug builds reach scripts/mock-github.py on the host; public internet stays HTTPS-only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shard.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO

  ShardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ShardUITests
    dependencies:
      - target: Shard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shard.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shard:
    build:
      targets:
        Shard: all
        ShardUITests: [test]
    test:
      targets:
        - ShardUITests
