# Shard 的 Rust workspace。
[workspace]
resolver = "2"
members = ["src-tauri", "crates/shard-core", "crates/shard-cli"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
