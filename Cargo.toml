# Shard 的 Rust workspace。
#
# 三个成员共用一份 Cargo.lock：客户端与服务端依赖同一个 shard-core，版本一旦
# 分叉，两端对「一条笔记是什么」的理解就会悄悄不同——共享 crate 的意义正在于
# 此，锁文件分开就白搭了。
[workspace]
resolver = "2"
members = ["src-tauri", "crates/shard-core", "crates/shard-server"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
libsql = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
