# Litestream：把 SQLite 持续复制到对象存储。
#
# 这是**唯一**的异地备份。单台 VPS 的磁盘快照不算——磁盘和机器一起没了的时候
# 它也一起没了。配置完成后务必做一次恢复演练，没演练过的备份等于没有备份：
#
#   litestream restore -o /tmp/verify.sqlite3 /var/lib/shard/notes.sqlite3
#   sqlite3 /tmp/verify.sqlite3 'PRAGMA integrity_check; SELECT count(*) FROM fragments;'
dbs:
  - path: /var/lib/shard/notes.sqlite3
    replicas:
      - type: s3
        bucket: shard-backup
        path: notes
        region: auto
        # 凭据走环境变量，不要写进这个文件：
        #   LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY
        endpoint: ${S3_ENDPOINT}
        # 保留 30 天的历史，够覆盖「几周后才发现数据被误删」这种情况。
        retention: 720h
        snapshot-interval: 24h
