[package]
name = "shard"
version = "0.1.3"
description = "A lightweight Markdown fragment capture app powered by Git."
authors = ["panyuhang"]
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 表格文档导入：Excel / CSV 等转 Markdown。按文件内容识别格式，
# 扩展名只在无签名格式（CSV）时兜底。
anydoc = "0.1.8"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
# Keep WKWebView's IEEE-754 canvas positions exact across the JSON save boundary.
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_yaml = "0.9"
chrono = { workspace = true }
base64 = "0.22"
rand = "0.8"
sha2 = { workspace = true }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
shard-core = { path = "../crates/shard-core" }
# 密匣的加密格式（口令派生、主密钥包裹、信封），与将来的客户端模式、网页端同一格式。
shard-lockbox = { path = "../crates/shard-lockbox" }
# 公开内容的领域逻辑（碎片、资料库树、回收站、图片、导图、画布、数据集、XLSX 导入解析），与服务端共用。
shard-vault = { path = "../crates/shard-vault" }
# 监听 vault 的外部写入（终端 shard、AI 助手、其他编辑器），macOS 上走 FSEvents。
notify = "8.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSCursor",
    "NSPasteboard",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSData",
] }

[dev-dependencies]
tempfile = "3"
