[package]
name = "shard"
version = "0.1.3"
description = "A lightweight Markdown fragment capture app powered by Git."
authors = ["panyuhang"]
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
chrono = { workspace = true }
base64 = "0.22"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { workspace = true }
# 记账（债务追踪）模块的存储后端：libSQL（Turso）。默认 features 已含
# core/replication/remote/sync，支持 embedded replica（本地文件 + 远程同步）。
libsql = { workspace = true }
# 客户端与服务端共享的核心：分词、表定义、内容指纹、同步报文。
# 两端调用同一份实现，是为了杜绝那些只会表现为「数据不对」的静默漂移。
shard-core = { path = "../crates/shard-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSPasteboard",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSData",
] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
