<!doctype html>
<!-- data-density：kiln 的产品级密度档（见 vendor/kiln/SKILL.md → Density Ladder）。
     Shard 是工具面密集、长时停留的知识工作台，走 compact 档；kiln 的 standard 档
     是为数据表 + 表单为主的后台标定的。只影响控件几何，不影响字号与间距。 -->
<html lang="en" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shard</title>
    <!-- 首帧明暗：在样式与模块脚本之前给 <html> 定 .dark，避免深色用户启动时
         先闪一帧浅色。逻辑与 src/lib/theme.ts 的 initColorMode 一致，那边是真相源。 -->
    <script>
      (function () {
        // 存储不可用时与 theme.ts 一样回退到跟随系统，而不是停在浅色。
        var mode = "system";
        try { mode = localStorage.getItem("shard.colorMode") || "system"; } catch (_) {}
        var dark = mode === "dark";
        if (mode !== "dark" && mode !== "light") {
          try { dark = matchMedia("(prefers-color-scheme: dark)").matches; } catch (_) {}
        }
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
