[package]
name = "shard-server"
version = "0.1.3"
description = "Shard 服务端：内容库的唯一写者，提供 RPC、SSE、文件与同步端点，通行密钥登录，并托管网页。"
edition.workspace = true
publish = false

[features]
# 只给端到端测试用：提供直接签发会话的测试端点。发行版绝不能打开。
test-auth = []

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
rand = "0.8"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shard-core = { path = "../shard-core" }
shard-store = { path = "../shard-store" }
shard-vault = { path = "../shard-vault" }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webauthn-rs = "0.5"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
