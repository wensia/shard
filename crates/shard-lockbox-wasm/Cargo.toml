[package]
name = "shard-lockbox-wasm"
version = "0.1.3"
description = "浏览器里的密匣：shard-lockbox 与密匣领域逻辑编成 wasm，主密钥只在 wasm 内存里。"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shard-lockbox = { path = "../shard-lockbox" }
shard-core = { path = "../shard-core" }
serde_json = { workspace = true }
wasm-bindgen = "=0.2.122"
# wasm32-unknown-unknown 上的随机数与时钟走浏览器（crypto.getRandomValues、Date）。
getrandom = { version = "0.2", features = ["js"] }
chrono = { workspace = true, features = ["wasmbind"] }
