[package]
name = "shard-store"
version = "0.1.3"
description = "Shard 的存储层：Vfs 抽象（本地目录 / SQLite 两种实现）与服务端内容库。不依赖 Tauri。"
edition.workspace = true
publish = false

[dependencies]
chrono = { workspace = true }
rand = "0.8"
# 与 src-tauri 同一版本：libsqlite3-sys 在依赖图里只能出现一次。
rusqlite = { version = "=0.40.2", features = ["blob", "bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shard-core = { path = "../shard-core" }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
