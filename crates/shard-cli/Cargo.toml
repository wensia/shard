[package]
name = "shard-cli"
version = "0.1.3"
description = "Shard 终端快捷创建：shard #标签 /任务列表 内容"
edition.workspace = true
publish = false

# 构建产物叫 shard-cli，避免与 App 的 `shard` bin 在 target/ 里同名覆盖；
# scripts/install-cli.sh 安装时再改名为 `shard`。
[[bin]]
name = "shard-cli"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
shard-core = { path = "../shard-core" }

[dev-dependencies]
tempfile = "3"
