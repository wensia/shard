[package]
name = "shard-cli"
version = "0.1.3"
description = "Shard 终端快捷创建：shard #标签 /任务列表 内容"
edition.workspace = true
publish = false

# 构建产物叫 shard-cli，避免与 App 的 `shard` bin 在 target/ 里同名覆盖；
# scripts/install-cli.sh 安装时再改名为 `shard`。
[[bin]]
name = "shard-cli"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shard-core = { path = "../shard-core" }
# 远程模式：RPC 客户端、服务器地址规则、令牌存储（钥匙串服务 dev.shard.cli）与登录，与桌面共用。
shard-remote = { path = "../shard-remote" }
# 追加规则、目标解析、数据集幂等追加等与服务端命令行 RPC 共用的领域逻辑（shard_vault::cli）。
shard-vault = { path = "../shard-vault" }
ratatui = "0.30.2"
# shard login 输入密码时不回显。
rpassword = "7"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3"
# 远程模式集成测试里的转发代理直接发 HTTP。
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# 远程模式集成测试：在测试进程里起一个真的 shard-server。不打开 test-auth（免密会话端点），
# 避免特性合并把它带进同一次构建里的服务端二进制。
axum = "0.8"
shard-server = { path = "../shard-server" }
shard-store = { path = "../shard-store" }
tokio = { version = "1", features = ["full"] }
