[package]
name = "shard-core"
version = "0.1.3"
description = "Vault 文件格式核心：碎片 frontmatter、标签规则与原子写。App 与 CLI 共用，不依赖 Tauri。"
edition.workspace = true
publish = false

[dependencies]
chrono = { workspace = true }
csv = "1.4"
# 外部 CSV 常见 GBK/UTF-16：识别后只读预览，转换成 UTF-8 才可编辑。
encoding_rs = "0.8"
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_yaml = "0.9"
sha2 = { workspace = true }
# wikilink 目标归一化要与前端 `normalize("NFKC")` 一致。
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
