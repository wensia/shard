[package]
name = "shard-core"
version = "0.1.0"
edition.workspace = true
description = "Shard 客户端与服务端共享的数据模型、schema 与检索逻辑"

# 这个 crate 被 src-tauri（Tauri 客户端）和 shard-server（后端）共同依赖。
# 任何放进来的逻辑都必须是两端都要用且必须保持一致的：全文检索的分词、表定义、
# 内容指纹、同步报文的形状。这些一旦两端漂移，症状都是静默的数据问题——搜不到、
# 对不上、同步过去变了样，而不是一个干脆的编译错误。
[dependencies]
serde = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# 仅用于集成测试：在真实 FTS5 里验证分词方案确实可行（见 tests/fts_fts5.rs）。
# 不是生产依赖——shard-core 本身不碰数据库。
libsql = { workspace = true }
tokio = { workspace = true }
