[package]
name = "shard-remote"
version = "0.1.3"
description = "Shard 远程客户端：服务器地址规则、设备配对、令牌与配置存储、带幂等键与重试的 RPC、SSE 读取。命令行与桌面共用。"
edition.workspace = true
publish = false

[dependencies]
chrono = { workspace = true }
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# 同步 HTTP 客户端，rustls（webpki 根证书），不引入异步运行时。3.5 起才有 `timeout_per_read`（SSE 判断死连接）。
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 设备令牌存 macOS 钥匙串（通用密码项）。
security-framework = "3"

[dev-dependencies]
tempfile = "3"
